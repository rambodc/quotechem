# This file mirrors the prod deploy, but targets the dev project
# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on dev push
on:
  push:
    branches:
      - dev
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    environment: Dev
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          token_format: access_token
          workload_identity_provider: "projects/904627453868/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
          service_account: "github-firebase-deployer@showmaster1-f1a9f.iam.gserviceaccount.com"
      - name: Create .env for React build
        run: |
          cat > .env << 'EOF'
          REACT_APP_FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }}
          REACT_APP_FIREBASE_APP_ID=${{ secrets.FIREBASE_APP_ID }}
          REACT_APP_FIREBASE_AUTH_DOMAIN=${{ secrets.FIREBASE_AUTH_DOMAIN }}
          REACT_APP_FIREBASE_MEASUREMENT_ID=${{ secrets.FIREBASE_MEASUREMENT_ID }}
          REACT_APP_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          REACT_APP_FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}
          REACT_APP_FIREBASE_STORAGE_BUCKET=${{ secrets.FIREBASE_STORAGE_BUCKET }}
          REACT_APP_STRIPE_PUBLISHABLE_KEY=${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          EOF
      - name: Build
        env:
          CI: false
          DISABLE_ESLINT_PLUGIN: true
        run: npm ci && npm run build
      - name: Deploy Hosting to dev
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ env.GOOGLE_GHA_CREDS_PATH }}
        run: |
          npm install -g firebase-tools
          firebase deploy --only hosting --project showmaster1-f1a9f --non-interactive --message "CI deploy (dev)"
