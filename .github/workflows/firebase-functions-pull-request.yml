name: 'PR: Firebase Functions Validation'

on:
  pull_request:
    paths:
      - 'functions/**'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/firebase-functions-pull-request.yml'

jobs:
  validate_functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install Functions dependencies
        run: npm ci --prefix functions

      - name: Syntax check deployed function modules
        run: find functions -maxdepth 1 -name '*.js' -print0 | xargs -0 -n1 node --check
