# https://github.com/firebase/firebase-tools

name: 'Production: Firebase Hosting'
on:
  push:
    branches:
      - production
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'firebase.json'
      - '.firebaserc'
      - 'env.example'
      - '.github/workflows/firebase-hosting-merge.yml'
  workflow_dispatch:
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    environment: Prod
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Validate required WIF secrets
        run: |
          test -n "${{ secrets.GCP_WIF_PROVIDER }}" || { echo "Missing secret: GCP_WIF_PROVIDER"; exit 1; }
          test -n "${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}" || { echo "Missing secret: GCP_SERVICE_ACCOUNT_EMAIL"; exit 1; }
      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}
      - name: Ensure public anonymous authentication is enabled
        run: |
          ACCESS_TOKEN="$(gcloud auth print-access-token)"
          curl --fail-with-body --silent --show-error --request PATCH \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -H "x-goog-user-project: quotechemfb" \
            "https://identitytoolkit.googleapis.com/admin/v2/projects/quotechemfb/config?updateMask=signIn.anonymous.enabled" \
            --data '{"signIn":{"anonymous":{"enabled":true}}}'
      - name: Create .env for React build
        run: |
          cat > .env << 'EOV'
          REACT_APP_FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }}
          REACT_APP_FIREBASE_APP_ID=${{ secrets.FIREBASE_APP_ID }}
          REACT_APP_FIREBASE_AUTH_DOMAIN=${{ secrets.FIREBASE_AUTH_DOMAIN }}
          REACT_APP_FIREBASE_MEASUREMENT_ID=${{ secrets.FIREBASE_MEASUREMENT_ID }}
          REACT_APP_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          REACT_APP_FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}
          REACT_APP_FIREBASE_STORAGE_BUCKET=${{ secrets.FIREBASE_STORAGE_BUCKET }}
          REACT_APP_APPCHECK_SITE_KEY=${{ secrets.REACT_APP_APPCHECK_SITE_KEY }}
          EOV
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test -- --watchAll=false
      - name: Build
        env:
          CI: false
          DISABLE_ESLINT_PLUGIN: true
        run: npm run build
      - name: Deploy Hosting (live)
        run: |
          npm install -g firebase-tools
          firebase deploy --only hosting --project quotechemfb --non-interactive --message "CI deploy (production)"
